name: Build Mostlee APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Save main.dart
        run: cp lib/main.dart lib/main.dart.bak || true

      - name: Generate Android structure
        run: |
          flutter create . --platforms=android --overwrite
          cp lib/main.dart.bak lib/main.dart || true

      - name: Enable Internet Permission
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          path = 'android/app/src/main/AndroidManifest.xml'
          tree = ET.parse(path)
          root = tree.getroot()
          perm = ET.Element('uses-permission', {'android:name': 'android.permission.INTERNET'})
          root.insert(0, perm)
          tree.write(path)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mostlee-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
